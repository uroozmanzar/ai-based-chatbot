<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Chatbot - Basic NLP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chatbox {
      background: #fff;
      width: 90%;
      max-width: 400px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #2c7be5;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      border-radius: 12px 12px 0 0;
    }
    .messages {
      padding: 15px;
      flex: 1;
      overflow-y: auto;
      font-size: 14px;
    }
    .user {
      text-align: right;
      margin-bottom: 10px;
      color: #000;
    }
    .bot {
      text-align: left;
      margin-bottom: 10px;
      color: #2c7be5;
    }
    .input-box {
      display: flex;
      border-top: 1px solid #ddd;
    }
    input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
      font-size: 14px;
    }
    button {
      background: #2c7be5;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="chatbox">
  <div class="header">AI Chatbot (Basic NLP)</div>
  <div class="messages" id="chat"></div>
  <div class="input-box">
    <input type="text" id="userInput" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const responses = {
    "hello": "Hello! How can I help you?",
    "hi": "Hi there! 😊",
    "what is ai": "AI stands for Artificial Intelligence. It enables machines to think like humans.",
    "who made you": "I was created by Urooz Manzar as a school AI project.",
    "what is your name": "I am a basic AI chatbot.",
    "bye": "Goodbye! Have a great day!"
  };

  function sendMessage() {
    const input = document.getElementById("userInput");
    const message = input.value.toLowerCase();
    if (message === "") return;

    addMessage(message, "user");

    let reply = "Sorry, I didn't understand that.";
    for (let key in responses) {
      if (message.includes(key)) {
        reply = responses[key];
        break;
      }
    }

    setTimeout(() => addMessage(reply, "bot"), 500);
    input.value = "";
  }

  function addMessage(text, sender) {
    const chat = document.getElementById("chat");
    const msg = document.createElement("div");
    msg.className = sender;
    msg.textContent = text;
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
  }
</script>

</body>
</html>
